<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Airgonomics</title>
    <style>
        /* 1. Prevent the page itself from scrolling */
        html, body {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            background-color: #443f3f;
            display: flex;          /* Enables Flexbox layout */
            flex-direction: column; /* Stacks elements vertically */
            align-items: center;    /* Centers everything horizontally */
        }

        /* 2. Set strict limits on EVERY element */
        * {
            box-sizing: border-box; /* Includes padding/border in the width calculation */
            max-width: 100vw;       /* Max width = 100% of viewport width */
            max-height: 100vh;      /* Max height = 100% of viewport height */
        }

        /* 3. Ensure images don't break the layout */
        img, video {
            object-fit: contain;    /* Scales image to fit without stretching */
        }
        h2, p {
            text-align: center;
        }
    </style>
</head>
<body>
    <h2>Story of Airgonomics</h2>
    <p>They make the best hairdryer</p>
    <p>JU Industriell Design 2 Uppgift</p>
    <br>
    <video src="./harfon.mp4" controls style="max-width: 100%; height: auto;"></video>
    <img src="./sosexy.png" alt="">
</body>

</html>
